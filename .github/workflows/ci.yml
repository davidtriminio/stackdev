name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build stackdev.slnx -c Release
      - name: Test
        run: dotnet test stackdev.slnx -c Release --no-build

  remote-script:
    name: Remote script (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell tests
        run: DEBUG=1 bash tests/remote/remote-script.test.sh
