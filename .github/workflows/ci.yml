name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build stackdev.slnx -c Release
      - name: Test
        run: dotnet test stackdev.slnx -c Release --no-build

  remote-script:
    name: Remote script (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell tests
        run: bash tests/remote/remote-script.test.sh

  cross-platform:
    name: Cross-platform app and core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The Windows window (WPF) cannot be built here; the Avalonia app and the core can.
      - name: Build the app
        run: dotnet build src/StackDev.App -c Release
      - name: Core tests
        run: dotnet test tests/StackDev.Core.Tests -c Release
      - name: App tests (headless)
        run: dotnet test tests/StackDev.App.Tests -c Release
